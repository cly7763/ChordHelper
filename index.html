  <meta name="description" content="SubV7, 세컨더리 도미넌트, SDM 모달 인터체인지를 직관적으로 연결하는 인터랙티브 코드 진행 빌더." />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #080c14;
      color: #f8fafc;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }
    header {
      padding: 8px 16px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      z-index: 10;
      flex-wrap: wrap;
      gap: 8px;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #38bdf8;
    }
    .badge-pro {
      font-size: 0.65rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .controls {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .ctrl-box {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #030712;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      font-size: 0.75rem;
      color: #cbd5e1;
    }
    select {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 2px 4px;
      font-weight: bold;
      cursor: pointer;
      outline: none;
      font-size: 0.75rem;
    }
    .ctrl-box input[type="range"] {
      width: 55px;
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .bpm-val {
      font-weight: 700;
      color: #38bdf8;
      width: 22px;
      text-align: right;
    }
    button {
      background: #38bdf8;
      color: #030712;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    button:hover { background: #7dd3fc; }
    button.secondary { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    button.secondary:hover { background: #334155; color: #fff; }
    button.stop-btn { background: #ef4444; color: #fff; }
    button.stop-btn:hover { background: #f87171; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* 언어 선택 스위처 스타일 */
    .lang-switcher {
      display: flex;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 2px;
      gap: 2px;
      margin-left: 10px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 4px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 16px;
      transition: all 0.2s ease;
    }
    .lang-btn.active {
      background: #38bdf8;
      color: #0f172a;
    }

    #main-container {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #canvas-container {
      flex: 1;
      position: relative;
      min-width: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #sidebar {
      width: 350px;
      background: #0f172a;
      border-left: 1px solid #1e293b;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: -4px 0 20px rgba(0,0,0,0.5);
      justify-content: space-between;
      overflow-y: auto;
    }
    .sidebar-content {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .panel-section {
      background: #080c14;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }
    .panel-section h3 {
      font-size: 0.72rem;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }
    .chord-name-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chord-name {
      font-size: 1.4rem;
      font-weight: 800;
      color: #38bdf8;
    }
    .chord-role {
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }
    .role-tonic { background: #064e3b; color: #34d399; }
    .role-subdominant { background: #1e3a8a; color: #60a5fa; }
    .role-dominant { background: #7f1d1d; color: #f87171; }
    .role-secondary { background: #78350f; color: #facc15; }
    .role-subv { background: #581c87; color: #c084fc; }
    .role-sdm { background: #831843; color: #f472b6; }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .tag {
      font-size: 0.72rem;
      padding: 3px 8px;
      background: #1e293b;
      border-radius: 4px;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid #334155;
    }
    .tag:hover {
      background: #334155;
      color: #f8fafc;
      border-color: #38bdf8;
    }
    .tag.active {
      background: #0ea5e9;
      color: #030712;
      font-weight: bold;
      border-color: #38bdf8;
    }

    /* 다음 추천 연결 카드 */
    .recom-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
      max-height: 140px;
      overflow-y: auto;
    }
    .recom-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      border: 1px solid #1e293b;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.75rem;
    }
    .recom-item:hover {
      border-color: #38bdf8;
      background: #1e293b;
      transform: translateX(3px);
    }
    .recom-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .recom-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
    }
    .badge-diatonic { background: #1e3a8a; color: #93c5fd; }
    .badge-dominant { background: #7f1d1d; color: #fca5a5; }
    .badge-secondary { background: #78350f; color: #fde047; }
    .badge-subv { background: #581c87; color: #d8b4fe; }
    .badge-sdm { background: #831843; color: #f9a8d4; }

    .progression-list {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding: 2px 0;
      min-height: 38px;
      align-items: center;
    }
    .prog-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      background: #1e293b;
      border-radius: 5px;
      font-weight: bold;
      font-size: 0.75rem;
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid #334155;
    }
    .prog-item:hover { border-color: #ef4444; }
    .prog-item.active {
      background: #38bdf8;
      color: #030712;
      border-color: #7dd3fc;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }
    .prog-item-del {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .footer-brand {
      border-top: 1px solid #1e293b;
      padding-top: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #64748b;
      font-size: 0.68rem;
    }

    /* 모바일 반응형 */
    @media (max-width: 768px) {
      #main-container {
        flex-direction: column;
      }
      #canvas-container {
        flex: 1.3;
        min-height: 290px;
      }
      #sidebar {
        width: 100%;
        flex: 1;
        border-left: none;
        border-top: 1px solid #1e293b;
        padding: 10px;
      }
      .panel-section {
        padding: 6px 8px;
      }
      .chord-name {
        font-size: 1.2rem;
      }
      .recom-list {
        max-height: 90px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-group">
      <div class="title">ChordHelper</div>
      <span class="badge-pro">PRO</span>
    </div>

    <div class="controls">
      <div class="ctrl-box">
        <span data-i18n="lbl-key">Key</span>
        <select id="key-select">
          <option value="0">C Major</option>
          <option value="1">Db Major</option>
          <option value="2">D Major</option>
          <option value="3">Eb Major</option>
          <option value="4">E Major</option>
          <option value="5">F Major</option>
          <option value="6">F# Major</option>
          <option value="7">G Major</option>
          <option value="8">Ab Major</option>
          <option value="9">A Major</option>
          <option value="10">Bb Major</option>
          <option value="11">B Major</option>
        </select>
      </div>
      <div class="ctrl-box">
        <span>BPM</span>
        <input type="range" id="bpm-slider" min="40" max="200" value="90" />
        <span class="bpm-val" id="bpm-text">90</span>
      </div>
      <button class="secondary" id="btn-reset" data-i18n="btn-reset">초기화</button>
      <button id="btn-play" data-i18n="btn-play">재생 ▶</button>
      <button class="stop-btn" id="btn-stop" disabled data-i18n="btn-stop">정지 ⏹</button>
      <!-- 언어 전환 버튼 -->
      <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLanguage('ko')" id="btn-ko">KOR</button>
        <button class="lang-btn" onclick="setLanguage('en')" id="btn-en">ENG</button>
      </div>
    </div>
  </header>

  <div id="main-container">
    <div id="canvas-container">
      <canvas id="graph"></canvas>
    </div>

    <div id="sidebar">
      <div class="sidebar-content">
        <!-- 현재 화음 분석 -->
        <div class="panel-section">
          <h3 data-i18n="panel-analysis">선택 화음 분석</h3>
          <div class="chord-name-wrap">
            <span class="chord-name" id="info-name">-</span>
            <span id="info-role" class="chord-role" style="display: none;">-</span>
          </div>
          <p id="info-desc" style="font-size: 0.74rem; color: #94a3b8; margin-top: 4px; line-height: 1.35;" data-i18n="desc-default">노드를 터치하면 대리코드 및 진행 방향이 분석됩니다.</p>
        </div>

        <!-- 다음 추천 연결 (사이드바 카드 형태) -->
        <div class="panel-section">
          <h3 data-i18n="panel-recom">다음 추천 연결 (화성학 분기)</h3>
          <div class="recom-list" id="info-recom">
            <span style="font-size: 0.72rem; color: #64748b;" data-i18n="recom-default">코드를 선택하면 다음 추천 진행이 표시됩니다.</span>
          </div>
        </div>

        <!-- 추천 텐션 -->
        <div class="panel-section">
          <h3 data-i18n="panel-tension">추천 텐션 (Tensions)</h3>
          <div class="tag-container" id="info-tensions">
            <span class="tag" style="cursor: default;" data-i18n="tension-default">코드 미선택</span>
          </div>
        </div>

        <!-- 진행 시퀀스 -->
        <div class="panel-section">
          <h3 data-i18n="panel-sequence">진행 시퀀스</h3>
          <div class="progression-list" id="prog-container"></div>
        </div>
      </div>

      <div class="footer-brand">
        <span>DMK STUDIO HARMONY</span>
        <span>Clean Flow Architecture</span>
      </div>
    </div>
  </div>

            "V7_vim7": "Deceptive Cadence (vi)",
            "vim7_iim7": "Proceed to ii",
            "vim7_V7_ii": "Secondary Dominant (V7/ii)",
            "vim7_SubV7_ii": "Substitute Dominant (SubV/ii)",
            "vim7_IVmaj7": "To Subdominant (IV)",
            "SubV7_Imaj7": "Half-step Resolution (bII7 -> I)",
            "SubV7_ii_iim7": "Half-step Resolution (-> ii)",
            "V7_ii_iim7": "Resolve to Target (-> ii)",
            "V7_vi_vim7": "Resolve to Target (-> vi)",
            "ivm7_Imaj7": "Plagal Resolution (iv -> I)",
            "ivm7_bVII7": "Backdoor Progression",
            "bVII7_Imaj7": "Backdoor Resolution (-> Imaj7)"
        }
      }
    };

    let currentLang = 'ko';

    const NOTE_NAMES = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
    let currentKeyOffset = 0;

    const TENSION_SEMITONES = {
      "9": 14, "b9": 13, "#9": 15, "11": 17, "#11": 18, "13": 21, "b13": 20
    };

    const BASE_HARMONY_DEF = {
      "Imaj7": { rootInterval: 0, suffix: "maj7", deg: "Imaj7", category: "inner", angleDeg: 270, tensions: ["9", "13", "#11"], upperIntervals: [0, 4, 7, 11],
        transitions: [
          { targetId: "iim7", tag: "ii-V", type: "diatonic" },
          { targetId: "IVmaj7", tag: "IV", type: "diatonic" },
          { targetId: "V7_ii", tag: "V/ii", type: "secondary" },
          { targetId: "SubV7_ii", tag: "Sub/ii", type: "subv" },
          { targetId: "ivm7", tag: "SDM", type: "sdm" }
        ]
      },
      "iim7": { rootInterval: 2, suffix: "m7", deg: "iim7", category: "inner", angleDeg: 30, tensions: ["9", "11"], upperIntervals: [0, 3, 7, 10],
        transitions: [
          { targetId: "V7", tag: "V7", type: "dominant" },
          { targetId: "SubV7", tag: "SubV7", type: "subv" },
          { targetId: "bVII7", tag: "Backdoor", type: "sdm" }
        ]
      },
      "iiim7": { rootInterval: 4, suffix: "m7", deg: "iiim7", category: "inner", angleDeg: 90, tensions: ["9", "11"], upperIntervals: [0, 3, 7, 10],
        transitions: [
          { targetId: "vim7", tag: "vi", type: "diatonic" },
          { targetId: "V7_vi", tag: "V/vi", type: "secondary" },
          { targetId: "IVmaj7", tag: "IV", type: "diatonic" }
        ]
      },
      "IVmaj7": { rootInterval: 5, suffix: "maj7", deg: "IVmaj7", category: "inner", angleDeg: 210, tensions: ["9", "#11", "13"], upperIntervals: [0, 4, 7, 11],
        transitions: [
          { targetId: "ivm7", tag: "ivm", type: "sdm" },
          { targetId: "V7", tag: "V7", type: "dominant" },
          { targetId: "SubV7", tag: "SubV7", type: "subv" },
          { targetId: "iiim7", tag: "iii", type: "diatonic" }
        ]
      },
      "V7": { rootInterval: 7, suffix: "7", deg: "V7", category: "inner", angleDeg: 330, tensions: ["9", "b9", "#9", "#11", "b13", "13"], upperIntervals: [0, 4, 7, 10],
        transitions: [
          { targetId: "Imaj7", tag: "I", type: "diatonic" },
          { targetId: "vim7", tag: "vi", type: "diatonic" }
        ]
      },
      "vim7": { rootInterval: 9, suffix: "m7", deg: "vim7", category: "inner", angleDeg: 150, tensions: ["9", "11"], upperIntervals: [0, 3, 7, 10],
        transitions: [
          { targetId: "iim7", tag: "ii", type: "diatonic" },
          { targetId: "V7_ii", tag: "V/ii", type: "secondary" },
          { targetId: "SubV7_ii", tag: "Sub/ii", type: "subv" },
          { targetId: "IVmaj7", tag: "IV", type: "diatonic" }
        ]
      },
      "SubV7": { rootInterval: 1, suffix: "7", deg: "SubV7", category: "outer", angleDeg: 300, tensions: ["9", "#11", "13"], upperIntervals: [0, 4, 7, 10],
        transitions: [
          { targetId: "Imaj7", tag: "bII→I", type: "subv" }
        ]
      },
      "SubV7_ii": { rootInterval: 3, suffix: "7", deg: "SubV7/ii", category: "outer", angleDeg: 0, tensions: ["9", "#11", "13"], upperIntervals: [0, 4, 7, 10],
        transitions: [
          { targetId: "iim7", tag: "bIII→ii", type: "subv" }
        ]
      },
      "V7_ii": { rootInterval: 9, suffix: "7", deg: "V7/ii", category: "outer", angleDeg: 60, tensions: ["b9", "#9", "b13"], upperIntervals: [0, 4, 7, 10],
        transitions: [
          { targetId: "iim7", tag: "V→ii", type: "secondary" }
        ]
      },
      "V7_vi": { rootInterval: 4, suffix: "7", deg: "V7/vi", category: "outer", angleDeg: 120, tensions: ["b9", "b13"], upperIntervals: [0, 4, 7, 10],
        transitions: [
          { targetId: "vim7", tag: "V→vi", type: "secondary" }
        ]
      },
      "ivm7": { rootInterval: 5, suffix: "m7", deg: "ivm7 (SDM)", category: "outer", angleDeg: 180, tensions: ["9", "11"], upperIntervals: [0, 3, 7, 10],
        transitions: [
          { targetId: "Imaj7", tag: "iv→I", type: "sdm" },
          { targetId: "bVII7", tag: "iv→bVII", type: "sdm" }
        ]
      },
      "bVII7": { rootInterval: 10, suffix: "7", deg: "bVII7", category: "outer", angleDeg: 240, tensions: ["9", "#11", "13"], upperIntervals: [0, 4, 7, 10],
        transitions: [
          { targetId: "Imaj7", tag: "bVII→I", type: "sdm" }
        ]
      }
    };
    
    const CHORD_ROLES = {
        "Imaj7": "Tonic",
        "iim7": "Subdominant",
        "iiim7": "Tonic Sub",
        "IVmaj7": "Subdominant",
        "V7": "Dominant",
        "vim7": "Tonic Sub",
        "SubV7": "Substitute Dominant",
        "SubV7_ii": "Substitute Dominant",
        "V7_ii": "Secondary Dominant",
        "V7_vi": "Secondary Dominant",
        "ivm7": "SDM Substitution",
        "bVII7": "SDM Substitution"
    };

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) {
          el.textContent = TRANSLATIONS[lang][key];
        }
      });

      document.getElementById('btn-ko').classList.toggle('active', lang === 'ko');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      
      localStorage.setItem('preferred-lang', lang);
      
      CHORD_DATA = buildRuntimeChordData();
      updateSidebar(selectedChordId);
    }

    function getTranslatedText(category, key) {
        return TRANSLATIONS[currentLang][category][key] || key;
    }

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function getChordName(rootInterval, suffix) {
      const noteIdx = (currentKeyOffset + rootInterval) % 12;
      return NOTE_NAMES[noteIdx] + suffix;
    }

    function calculateVoicing(chordRootMidi, upperIntervals, activeTensions = []) {
      const notes = [];
      let bassMidi = (chordRootMidi % 12) + 36;
      notes.push(midiToFreq(bassMidi));

      let rawUpperMidis = upperIntervals.map(semi => chordRootMidi + semi);
      activeTensions.forEach(t => {
        if (TENSION_SEMITONES[t]) {
          rawUpperMidis.push(chordRootMidi + TENSION_SEMITONES[t]);
        }
      });

      rawUpperMidis.forEach(midi => {
        let normalized = midi;
        while (normalized < 54) normalized += 12;
        while (normalized > 76) normalized -= 12;
        notes.push(midiToFreq(normalized));
      });

      return [...new Set(notes)].sort((a, b) => a - b);
    }

    function buildRuntimeChordData() {
      const data = {};
      const baseMidiC3 = 48;
      const tonicMidi = baseMidiC3 + currentKeyOffset;

      Object.keys(BASE_HARMONY_DEF).forEach(id => {
        const item = BASE_HARMONY_DEF[id];
        const chordRootMidi = tonicMidi + item.rootInterval;
        const name = getChordName(item.rootInterval, item.suffix);
        const notes = calculateVoicing(chordRootMidi, item.upperIntervals);
        
        const roleStr = CHORD_ROLES[id];
        const roleTranslated = getTranslatedText("roles", roleStr);
        const descTranslated = getTranslatedText("descs", id);

        const transitions = item.transitions.map(t => {
            const labelKey = `${id}_${t.targetId}`;
            return {
                ...t,
                label: getTranslatedText("labels", labelKey)
            }
        });

        data[id] = {
          ...item,
          id: id,
          role: roleTranslated,
          desc: descTranslated,
          transitions: transitions,
          name: name,
          chordRootMidi: chordRootMidi,
          notes: notes
        };
      });
      return data;
    }

    let CHORD_DATA;
    let selectedChordId = null;
    let progression = [];
    let bpm = 90;

    const canvas = document.getElementById("graph");
    const ctx = canvas.getContext("2d");
    let width, height;
    const nodes = {};
    let harmonyIds = [];

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let activeNodes = [];
    let playbackTimeouts = [];
    let isPlaying = false;

    function initData() {
        harmonyIds = Object.keys(BASE_HARMONY_DEF);
        const savedLang = localStorage.getItem('preferred-lang');
        if (savedLang) {
          setLanguage(savedLang);
        } else {
          const userLang = navigator.language || navigator.userLanguage;
          setLanguage(userLang.startsWith('ko') ? 'ko' : 'en');
        }
    }

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      width = rect.width;
      height = rect.height;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);

      calculatePositions();
      draw();
    }

    function calculatePositions() {
      const minDim = Math.min(width, height);
      const centerX = width / 2;
      const centerY = height / 2;

      const isMobile = width < 500;
      const innerRadius = minDim * (isMobile ? 0.22 : 0.24);
      const outerRadius = minDim * (isMobile ? 0.41 : 0.41);
      const dynamicNodeRadius = Math.max(16, Math.min(26, minDim * 0.055));

      harmonyIds.forEach(id => {
        const item = CHORD_DATA[id];
        const rad = (item.angleDeg * Math.PI) / 180;
        const r = item.category === "inner" ? innerRadius : outerRadius;

        nodes[id] = {
          x: centerX + Math.cos(rad) * r,
          y: centerY + Math.sin(rad) * r,
          r: dynamicNodeRadius,
          id: id
        };
      });
    }

    function getRoleColor(id) {
      const role = CHORD_ROLES[id];
      if (role.includes("Tonic")) return "#10b981";
      if (role.includes("Subdominant")) return "#3b82f6";
      if (role.includes("Dominant") && !role.includes("Sub") && !role.includes("Sec")) return "#ef4444";
      if (role.includes("Secondary")) return "#eab308";
      if (role.includes("Substitute")) return "#a855f7";
      if (role.includes("SDM")) return "#ec4899";
      return "#64748b";
    }

    function getArrowColor(type) {
      if (type === "subv") return "#c084fc";
      if (type === "sdm") return "#f472b6";
      if (type === "secondary") return "#facc15";
      if (type === "dominant") return "#f87171";
      return "#38bdf8";
    }

    function drawCurvedArrow(p1, p2, isHighlight, type = "diatonic", curveOffset = 18) {
      const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      const nodeR = p1.r || 22;

      const startX = p1.x + Math.cos(angle) * (nodeR + 2);
      const startY = p1.y + Math.sin(angle) * (nodeR + 2);
      const endX = p2.x - Math.cos(angle) * (nodeR + 4);
      const endY = p2.y - Math.sin(angle) * (nodeR + 4);

      const midX = (startX + endX) / 2;
      const midY = (startY + endY) / 2;
      const normX = -(endY - startY);
      const normY = endX - startX;
      const len = Math.hypot(normX, normY) || 1;
      const cpX = midX + (normX / len) * (isHighlight ? curveOffset : 0);
      const cpY = midY + (normY / len) * (isHighlight ? curveOffset : 0);

      const strokeColor = isHighlight ? getArrowColor(type) : "rgba(100, 116, 139, 0.12)";

      ctx.save();
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = isHighlight ? 2.5 : 0.8;
      ctx.setLineDash(isHighlight ? [] : [2, 3]);

      if (isHighlight) {
        ctx.shadowColor = strokeColor;
        ctx.shadowBlur = 8;
      }

      ctx.beginPath();
      ctx.moveTo(startX, startY);
      if (isHighlight) {
        ctx.quadraticCurveTo(cpX, cpY, endX, endY);
      } else {
        ctx.lineTo(endX, endY);
      }
      ctx.stroke();

      if (isHighlight) {
        const headAngle = Math.atan2(endY - cpY, endX - cpX);
        const headlen = 9;

        ctx.fillStyle = strokeColor;
        ctx.beginPath();
        ctx.moveTo(endX, endY);
        ctx.lineTo(endX - headlen * Math.cos(headAngle - Math.PI / 6), endY - headlen * Math.sin(headAngle - Math.PI / 6));
        ctx.lineTo(endX - headlen * Math.cos(headAngle + Math.PI / 6), endY - headlen * Math.sin(headAngle + Math.PI / 6));
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);
      const currentHarmony = selectedChordId ? CHORD_DATA[selectedChordId] : null;

      harmonyIds.forEach(id => {
        const n = nodes[id];
        const data = CHORD_DATA[id];
        if (!n) return;
        data.transitions.forEach(t => {
          if (nodes[t.targetId] && id !== selectedChordId) {
            drawCurvedArrow(n, nodes[t.targetId], false, t.type, 0);
          }
        });
      });

      if (currentHarmony && nodes[selectedChordId]) {
        currentHarmony.transitions.forEach((t, idx) => {
          if (nodes[t.targetId]) {
            const curveOffset = ((idx % 2 === 0 ? 1 : -1) * (14 + idx * 3));
            drawCurvedArrow(nodes[selectedChordId], nodes[t.targetId], true, t.type, curveOffset);
          }
        });
      }

      const isMobile = width < 500;
      const nameFontSize = isMobile ? 9.5 : 11;
      const degFontSize = isMobile ? 7 : 8.5;

      harmonyIds.forEach(id => {
        const n = nodes[id];
        if (!n) return;
        const data = CHORD_DATA[id];
        const isSelected = id === selectedChordId;
        const isTarget = currentHarmony && currentHarmony.transitions.some(t => t.targetId === id);

        ctx.save();
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);

        ctx.fillStyle = isSelected ? "#38bdf8" : (isTarget ? "#1e293b" : "#0d1424");
        ctx.fill();

        ctx.lineWidth = isSelected ? 3 : (isTarget ? 2 : 1.2);
        ctx.strokeStyle = isSelected ? "#ffffff" : getRoleColor(id);
        
        if (isSelected) {
          ctx.shadowColor = "#38bdf8";
          ctx.shadowBlur = 12;
        }
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.fillStyle = isSelected ? "#090d16" : "#f8fafc";
        ctx.font = `bold ${nameFontSize}px sans-serif`;
        ctx.fillText(data.name, n.x, n.y - (isMobile ? 2 : 3));

        ctx.font = `600 ${degFontSize}px sans-serif`;
        ctx.fillStyle = isSelected ? "#090d16" : "#94a3b8";
        ctx.fillText(data.deg, n.x, n.y + (isMobile ? 8 : 9));

        ctx.restore();
      });
    }

    function playEPNote(freq, startTime, duration) {
      if (!audioCtx) audioCtx = new AudioContext();

      const oscSine = audioCtx.createOscillator();
      oscSine.type = "sine";
      oscSine.frequency.setValueAtTime(freq, startTime);

      const oscTri = audioCtx.createOscillator();
      oscTri.type = "triangle";
      oscTri.frequency.setValueAtTime(freq * 2, startTime);

      const filter = audioCtx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(Math.min(freq * 4.5, 2200), startTime);
      filter.frequency.exponentialRampToValueAtTime(Math.max(freq * 1.1, 160), startTime + duration);

      const gainSine = audioCtx.createGain();
      gainSine.gain.setValueAtTime(0.0001, startTime);
      gainSine.gain.linearRampToValueAtTime(0.065, startTime + 0.015);
      gainSine.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      const gainTri = audioCtx.createGain();
      gainTri.gain.setValueAtTime(0.0001, startTime);
      gainTri.gain.linearRampToValueAtTime(0.02, startTime + 0.01);
      gainTri.gain.exponentialRampToValueAtTime(0.0001, startTime + duration * 0.5);

      oscSine.connect(gainSine);
      oscTri.connect(gainTri);

      gainSine.connect(filter);
      gainTri.connect(filter);
      filter.connect(audioCtx.destination);

      oscSine.start(startTime);
      oscTri.start(startTime);
      oscSine.stop(startTime + duration);
      oscTri.stop(startTime + duration);

      activeNodes.push(oscSine, oscTri);
    }

    function playChord(notes, duration = 1.8) {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const now = audioCtx.currentTime;
      notes.forEach(freq => {
        playEPNote(freq, now, duration);
      });
    }

    function stopAllAudio() {
      playbackTimeouts.forEach(id => clearTimeout(id));
      playbackTimeouts = [];

      activeNodes.forEach(node => {
        try {
          if (node.stop) node.stop();
          if (node.disconnect) node.disconnect();
        } catch (e) {}
      });
      activeNodes = [];

      isPlaying = false;
      document.getElementById("btn-play").disabled = false;
      document.getElementById("btn-stop").disabled = true;

      document.querySelectorAll(".prog-item").forEach(el => el.classList.remove("active"));
    }

    function getChordDisplayName(baseName, tensions) {
      if (tensions.length === 0) return baseName;
      return `${baseName}(${tensions.join(",")})`;
    }

    function toggleTension(tensionLabel) {
      if (isPlaying) stopAllAudio();
      if (progression.length === 0) return;
      
      const currentProgItem = progression[progression.length - 1];
      const data = CHORD_DATA[currentProgItem.id];

      const idx = currentProgItem.tensions.indexOf(tensionLabel);
      if (idx > -1) {
        currentProgItem.tensions.splice(idx, 1);
      } else {
        currentProgItem.tensions.push(tensionLabel);
      }

      currentProgItem.finalName = getChordDisplayName(data.name, currentProgItem.tensions);
      currentProgItem.notes = calculateVoicing(data.chordRootMidi, data.upperIntervals, currentProgItem.tensions);

      playChord(currentProgItem.notes, 2.0);

      document.getElementById("info-name").innerText = currentProgItem.finalName;
      updateTensionTagsUI(data.tensions, currentProgItem.tensions);
      renderProgression();
    }

    function updateTensionTagsUI(availableTensions, activeTensions) {
      const tensionBox = document.getElementById("info-tensions");
      tensionBox.innerHTML = "";
      
      if (!availableTensions || availableTensions.length === 0) {
        tensionBox.innerHTML = `<span class="tag" style="cursor: default;">${TRANSLATIONS[currentLang]["tension-default"]}</span>`;
        return;
      }

      availableTensions.forEach(t => {
        const tag = document.createElement("span");
        tag.className = "tag";
        if (activeTensions.includes(t)) {
          tag.classList.add("active");
        }
        tag.innerText = t;
        tag.onclick = () => toggleTension(t);
        tensionBox.appendChild(tag);
      });
    }

    function getBadgeClass(type) {
      if (type === "subv") return "badge-subv";
      if (type === "sdm") return "badge-sdm";
      if (type === "secondary") return "badge-secondary";
      if (type === "dominant") return "badge-dominant";
      return "badge-diatonic";
    }

    function updateRecommendationUI(transitions) {
      const recomBox = document.getElementById("info-recom");
      recomBox.innerHTML = "";

      if (!transitions || transitions.length === 0) {
        recomBox.innerHTML = `<span style="font-size: 0.72rem; color: #64748b;">${TRANSLATIONS[currentLang]["recom-default"]}</span>`;
        return;
      }

      transitions.forEach(t => {
        const targetData = CHORD_DATA[t.targetId];
        const item = document.createElement("div");
        item.className = "recom-item";
        
        item.innerHTML = `
          <div class="recom-left">
            <span class="recom-badge ${getBadgeClass(t.type)}">${t.tag || 'Flow'}</span>
            <b>${targetData.name} <small style="color:#94a3b8">(${targetData.deg})</small></b>
          </div>
          <span style="color:#94a3b8; font-size:0.72rem;">${t.label} →</span>
        `;
        item.onclick = () => selectNode(t.targetId);
        recomBox.appendChild(item);
      });
    }

    function updateSidebar(chordId) {
      if (!chordId) {
        document.getElementById("info-name").innerText = "-";
        const roleElem = document.getElementById("info-role");
        roleElem.style.display = "none";
        document.getElementById("info-desc").innerText = TRANSLATIONS[currentLang]["desc-default"];
        updateRecommendationUI([]);
        updateTensionTagsUI([], []);
        renderProgression();
        return;
      }

      const data = CHORD_DATA[chordId];
      const currentProgItem = progression.length > 0 ? progression[progression.length - 1] : null;
      
      document.getElementById("info-name").innerText = currentProgItem ? currentProgItem.finalName : data.name;
      
      const roleElem = document.getElementById("info-role");
      roleElem.style.display = "inline-block";
      roleElem.innerText = data.role;
      roleElem.className = "chord-role";

      const originalRole = CHORD_ROLES[chordId];
      if (originalRole.includes("Tonic")) roleElem.classList.add("role-tonic");
      else if (originalRole.includes("Subdominant")) roleElem.classList.add("role-subdominant");
      else if (originalRole.includes("Dominant") && !originalRole.includes("Sub") && !originalRole.includes("Sec")) roleElem.classList.add("role-dominant");
      else if (originalRole.includes("Secondary")) roleElem.classList.add("role-secondary");
      else if (originalRole.includes("Substitute")) roleElem.classList.add("role-subv");
      else if (originalRole.includes("SDM")) roleElem.classList.add("role-sdm");

      document.getElementById("info-desc").innerText = data.desc;

      updateRecommendationUI(data.transitions);
      updateTensionTagsUI(data.tensions, currentProgItem ? currentProgItem.tensions : []);
      renderProgression();
    }

    function removeProgressionItem(index) {
      if (isPlaying) stopAllAudio();
      progression.splice(index, 1);
      
      if (progression.length > 0) {
        selectedChordId = progression[progression.length - 1].id;
      } else {
        selectedChordId = null;
      }
      
      updateSidebar(selectedChordId);
      draw();
    }

    function renderProgression() {
      const container = document.getElementById("prog-container");
      container.innerHTML = "";

      if (progression.length === 0) {
        container.innerHTML = `<span style="font-size: 0.72rem; color: #64748b;">${TRANSLATIONS[currentLang]["prog-default"]}</span>`;
        return;
      }

      progression.forEach((item, i) => {
        const div = document.createElement("div");
        div.className = "prog-item";
        div.id = `prog-item-${i}`;
        div.title = "클릭하여 삭제";
        
        div.innerHTML = `
          <span>${item.finalName}</span>
          <span class="prog-item-del">×</span>
        `;

        div.onclick = () => removeProgressionItem(i);
        container.appendChild(div);
      });
      container.scrollLeft = container.scrollWidth;
    }

    function addProgressionItem(chordId) {
      const data = CHORD_DATA[chordId];
      progression.push({
        id: chordId,
        tensions: [],
        finalName: data.name,
        notes: calculateVoicing(data.chordRootMidi, data.upperIntervals, [])
      });
    }

    function selectNode(chordId) {
      if (isPlaying) stopAllAudio();
      selectedChordId = chordId;
      
      addProgressionItem(chordId);
      
      const currentProgItem = progression[progression.length - 1];
      playChord(currentProgItem.notes, 2.0);
      
      updateSidebar(chordId);
      draw();
    }

    function handlePointerClick(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const clickX = clientX - rect.left;
      const clickY = clientY - rect.top;

      harmonyIds.forEach(id => {
        const n = nodes[id];
        if (!n) return;
        const dist = Math.hypot(clickX - n.x, clickY - n.y);
        if (dist <= n.r * 1.3) {
          selectNode(id);
        }
      });
    }

    canvas.addEventListener("click", (e) => {
      handlePointerClick(e.clientX, e.clientY);
    });

    document.getElementById("key-select").addEventListener("change", (e) => {
      if (isPlaying) stopAllAudio();
      currentKeyOffset = parseInt(e.target.value, 10);
      CHORD_DATA = buildRuntimeChordData();

      progression.forEach(item => {
        const data = CHORD_DATA[item.id];
        item.finalName = getChordDisplayName(data.name, item.tensions);
        item.notes = calculateVoicing(data.chordRootMidi, data.upperIntervals, item.tensions);
      });

      updateSidebar(selectedChordId);
      draw();
    });

    const bpmSlider = document.getElementById("bpm-slider");
    const bpmText = document.getElementById("bpm-text");
    bpmSlider.addEventListener("input", (e) => {
      bpm = parseInt(e.target.value, 10);
      bpmText.innerText = bpm;
    });

    document.getElementById("btn-play").addEventListener("click", () => {
      if (progression.length === 0) return;
      stopAllAudio();

      isPlaying = true;
      document.getElementById("btn-play").disabled = true;
      document.getElementById("btn-stop").disabled = false;

      const stepDurationMs = (60 / bpm) * 2 * 1000;
      const soundDurationSec = (stepDurationMs / 1000) * 1.2;

      progression.forEach((item, i) => {
        const timerId = setTimeout(() => {
          document.querySelectorAll(".prog-item").forEach(el => el.classList.remove("active"));
          const activeEl = document.getElementById(`prog-item-${i}`);
          if (activeEl) activeEl.classList.add("active");

          playChord(item.notes, soundDurationSec);

          if (i === progression.length - 1) {
            const endTimer = setTimeout(() => {
              stopAllAudio();
            }, stepDurationMs);
            playbackTimeouts.push(endTimer);
          }
        }, i * stepDurationMs);

        playbackTimeouts.push(timerId);
      });
    });

    document.getElementById("btn-stop").addEventListener("click", () => {
      stopAllAudio();
    });

    // 초기화 버튼 클릭 시 즉시 리셋 실행
    document.getElementById("btn-reset").addEventListener("click", () => {
      stopAllAudio();
      progression = [];
      selectedChordId = null;
      updateSidebar(null);
      draw();
    });

    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", () => setTimeout(resize, 100));

    // 실행
    initData();
    resize();
  </script>
</body>
</html>
